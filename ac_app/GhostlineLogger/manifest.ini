[ABOUT]
NAME = Ghostline
AUTHOR = Ghostline
VERSION = 2.3
DESCRIPTION = Shares every car's position and lap times with Ghostline (github.com/pr1tzy/ghostline). Also draws brake boards, a racing line and a 3D ghost of the best lap for your car (only you see them), and has a full dash: standings, timing, gear, delta, pedals and tyres in one window. The Ghostline window has the settings.

[CORE]
LAZY = NONE

[WINDOW_...]
ID = main
NAME = Ghostline
FUNCTION_MAIN = windowMain
FLAGS = AUTO_RESIZE

[WINDOW_...]
ID = dash
NAME = Ghostline Dash
FUNCTION_MAIN = windowDash
FLAGS = NO_BACKGROUND, FLOATING_TITLE_BAR, NO_SCROLLBAR, NO_COLLAPSE, AUTO_RESIZE
PADDING = 0, 0

[SIM_CALLBACKS]
UPDATE = update
