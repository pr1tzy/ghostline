[ABOUT]
NAME = Ghostline
AUTHOR = Ghostline
VERSION = 2.3
DESCRIPTION = Shares every car's position and lap times with Ghostline (github.com/pr1tzy/ghostline). Also draws brake boards, a racing line and a 3D ghost of the best lap for your car (only you see them), and has a full dash: gear, delta, timing, pedals, tyres and standings. The Ghostline window has the settings.

[CORE]
LAZY = NONE

[WINDOW_...]
ID = main
NAME = Ghostline
FUNCTION_MAIN = windowMain
FLAGS = AUTO_RESIZE

[WINDOW_...]
ID = gear
NAME = Ghostline Gear
FUNCTION_MAIN = windowGear
FLAGS = NO_BACKGROUND, FLOATING_TITLE_BAR, NO_SCROLLBAR, NO_COLLAPSE, AUTO_RESIZE
PADDING = 0, 0

[WINDOW_...]
ID = delta
NAME = Ghostline Delta
FUNCTION_MAIN = windowDelta
FLAGS = NO_BACKGROUND, FLOATING_TITLE_BAR, NO_SCROLLBAR, NO_COLLAPSE, AUTO_RESIZE
PADDING = 0, 0

[WINDOW_...]
ID = timing
NAME = Ghostline Timing
FUNCTION_MAIN = windowTiming
FLAGS = NO_BACKGROUND, FLOATING_TITLE_BAR, NO_SCROLLBAR, NO_COLLAPSE, AUTO_RESIZE
PADDING = 0, 0

[WINDOW_...]
ID = pedals
NAME = Ghostline Pedals
FUNCTION_MAIN = windowPedals
FLAGS = NO_BACKGROUND, FLOATING_TITLE_BAR, NO_SCROLLBAR, NO_COLLAPSE, AUTO_RESIZE
PADDING = 0, 0

[WINDOW_...]
ID = tyres
NAME = Ghostline Tyres
FUNCTION_MAIN = windowTyres
FLAGS = NO_BACKGROUND, FLOATING_TITLE_BAR, NO_SCROLLBAR, NO_COLLAPSE, AUTO_RESIZE
PADDING = 0, 0

[WINDOW_...]
ID = standings
NAME = Ghostline Standings
FUNCTION_MAIN = windowStandings
FLAGS = NO_BACKGROUND, FLOATING_TITLE_BAR, NO_SCROLLBAR, NO_COLLAPSE, AUTO_RESIZE
PADDING = 0, 0

[SIM_CALLBACKS]
UPDATE = update
