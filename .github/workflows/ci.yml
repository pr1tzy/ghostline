name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt pip-audit httpx
      - name: Compile
        run: python -m compileall -q backend run.py tests
      - name: Frontend syntax
        run: node --check frontend/js/app.js
      - name: Sample laps test (offline)
        run: python tests/test_samples.py
      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt
